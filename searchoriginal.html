<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Players Directory</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

/* HEADER BAR */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 20px auto;
  border-bottom: 2px solid #003366;
  padding-bottom: 10px;
}

.header-title {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}

.search-toggle-btn {
  font-size: 16px;
  background: #003366;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  user-select: none;
  transition: background 0.2s;
}

.search-toggle-btn:hover {
  background: #004080;
}

/* SEARCH FIELD WRAPPER */
#searchWrapper {
  max-width: 1200px;
  margin: 0 auto 20px auto;
  display: none;
}

#searchInput {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 2px solid #003366;
  background: #111;
  color: white;
  box-sizing: border-box;
}

#searchInput:focus {
  outline: none;
  border-color: #3b82f6;
}

/* DIRECTORY MATRIX (3 Columns Grid layout) */
.players-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  max-width: 1200px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .players-grid {
    grid-template-columns: 1fr; /* Stack columns neatly on smaller display viewports */
  }
}

/* INDIVIDUAL DATA PLAYER TILES */
.player-tile {
  background: #001f3f;
  border: 1px solid #003366;
  border-radius: 8px;
  padding: 15px;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, background 0.2s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player-tile:hover {
  transform: translateY(-3px);
  border-color: #3b82f6;
  background: #002a54;
}

.tile-row {
  font-size: 15px;
  word-break: break-all;
}

.label {
  font-size: 11px;
  text-transform: uppercase;
  color: #3b82f6;
  display: block;
  margin-bottom: 2px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.name-value {
  font-size: 18px;
  font-weight: bold;
}

/* CENTRALIZED POPUP OVERLAY SCREEN */
#modalOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-card {
  background: #111;
  border: 2px solid #3b82f6;
  border-radius: 12px;
  padding: 30px;
  width: 90%;
  max-width: 450px;
  box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
  position: relative;
}

.modal-card h3 {
  margin-top: 0;
  border-bottom: 1px solid #222;
  padding-bottom: 10px;
  color: #3b82f6;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.modal-meta-row {
  margin: 14px 0;
  font-size: 16px;
}

.modal-meta-row span {
  font-weight: bold;
  color: #fff;
}
</style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">REGISTERED PLAYERS</div>
    <div class="search-toggle-btn" onclick="toggleSearchField()">SEARCH</div>
  </div>

  <div id="searchWrapper">
    <input type="text" id="searchInput" placeholder="Type letters to filter profiles dynamically...">
  </div>

  <div class="players-grid" id="playersContainer">
    </div>

  <div id="modalOverlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h3>Player Details</h3>
      <div class="modal-meta-row"><span class="label">Full Name</span><span id="popName"></span></div>
      <div class="modal-meta-row"><span class="label">Email Address</span><span id="popEmail"></span></div>
      <div class="modal-meta-row"><span class="label">Cellular Link</span><span id="popCell"></span></div>
      <div class="modal-meta-row"><span class="label">Referral Applied</span><span id="popReferral"></span></div>
      <div class="modal-meta-row"><span class="label">Registration Timeline</span><span id="popDate"></span></div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allPlayersMemoryBank = [];

// DOM Reference Hooks
const container = document.getElementById("playersContainer");
const searchWrapper = document.getElementById("searchWrapper");
const searchInput = document.getElementById("searchInput");
const modal = document.getElementById("modalOverlay");

/* ACCORDION UTILITIES FOR FILTER SECTIONS */
window.toggleSearchField = function() {
  if (searchWrapper.style.display === "block") {
    searchWrapper.style.display = "none";
    searchInput.value = "";
    renderEngine(allPlayersMemoryBank);
  } else {
    searchWrapper.style.display = "block";
    searchInput.focus();
  }
};

/* READ ENGINE PIPELINE */
async function pullSystemData() {
  container.innerHTML = "<div style='grid-column: span 3; text-align:center;'>Synchronizing database array...</div>";
  try {
    const snapshot = await get(ref(db, "users"));
    if (snapshot.exists()) {
      const collection = [];
      snapshot.forEach((childSnapshot) => {
        collection.push(childSnapshot.val());
      });

      // Render Chronologically: Newest Registrations on top
      collection.sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
      allPlayersMemoryBank = collection;
      renderEngine(allPlayersMemoryBank);
    } else {
      container.innerHTML = "<div style='grid-column: span 3; text-align:center;'>No player accounts exist inside directory node.</div>";
    }
  } catch (error) {
    console.error(error);
    container.innerHTML = "<div style='grid-column: span 3; text-align:center; color:red;'>Data Sync Failed.</div>";
  }
}

/* MAIN RENDER ENGINE */
function renderEngine(dataset) {
  container.innerHTML = "";
  if (dataset.length === 0) {
    container.innerHTML = "<div style='grid-column: span 3; text-align:center; color:orange;'>No matches located.</div>";
    return;
  }

  dataset.forEach((player) => {
    const tileCard = document.createElement("div");
    tileCard.className = "player-tile";
    
    // Explicit 3 rows per request requirement build setup
    tileCard.innerHTML = `
      <div class="tile-row"><span class="label">Name & Surname</span><span class="name-value">${player.name || ''} ${player.surname || ''}</span></div>
      <div class="tile-row"><span class="label">Email Address</span>${player.email || 'N/A'}</div>
      <div class="tile-row"><span class="label">Cell Number</span>${player.cellNumber || 'N/A'}</div>
    `;

    tileCard.onclick = () => launchProfileModal(player);
    container.appendChild(tileCard);
  });
}

/* REAL-TIME KEY INPUT COMPILER ENGINE */
searchInput.addEventListener("input", (event) => {
  const matchingQuery = event.target.value.toLowerCase().trim();
  
  const filteredOutput = allPlayersMemoryBank.filter((profile) => {
    const termName = (profile.name || "").toLowerCase();
    const termSurname = (profile.surname || "").toLowerCase();
    const combinedWhole = `${termName} ${termSurname}`;
    const termEmail = (profile.email || "").toLowerCase();
    const termCell = (profile.cellNumber || "").toLowerCase();

    return termName.includes(matchingQuery) || 
           termSurname.includes(matchingQuery) || 
           combinedWhole.includes(matchingQuery) ||
           termEmail.includes(matchingQuery) ||
           termCell.includes(matchingQuery);
  });

  renderEngine(filteredOutput);
});

/* DETAILED INTERACTIVE INTERFACE MODALS */
function launchProfileModal(playerObj) {
  document.getElementById("popName").innerText = `${playerObj.name || ''} ${playerObj.surname || ''}`;
  document.getElementById("popEmail").innerText = playerObj.email || 'N/A';
  document.getElementById("popCell").innerText = playerObj.cellNumber || 'N/A';
  document.getElementById("popReferral").innerText = playerObj.referral ? playerObj.referral : "None Utilized";
  
  if (playerObj.createdAt) {
    const calendarDate = new Date(playerObj.createdAt);
    document.getElementById("popDate").innerText = calendarDate.toLocaleString();
  } else {
    document.getElementById("popDate").innerText = "Legacy Record";
  }

  modal.style.display = "flex";
}

/* INTERFACE SYSTEM DISMISSAL TRIGGER */
window.closeModal = function() {
  modal.style.display = "none";
};

// Initialize Database Connection
pullSystemData();
</script>

</body>
</html>
