<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Slide Winners</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
  }

  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto 30px auto;
    border-bottom: 2px solid #003366;
    padding-bottom: 15px;
  }

  .header-title {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* PLUS BUTTON */
  .plus-btn {
    background: #00adb5;
    color: white;
    font-size: 24px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 173, 181, 0.4);
    user-select: none;
  }
  .plus-btn:hover {
    background: #008c94;
  }

  #fileInput {
    display: none;
  }

  /* 4 COLUMNS GRID LAYOUT */
  .winners-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 1024px) {
    .winners-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .winners-grid { grid-template-columns: 1fr; }
  }

  .winner-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    box-sizing: border-box;
  }

  .winner-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .card-date {
    font-size: 13px;
    color: #00adb5;
    font-weight: bold;
    margin-bottom: 12px;
    text-align: center;
  }

  .card-actions {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid #222;
  }

  .action-icon {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 6px;
    border-radius: 4px;
    transition: background 0.2s;
  }

  /* EYE STYLING: Highlight green when active, red when inactive */
  .eye-open.active-highlight {
    background: green !important;
    color: white;
  }
  .eye-closed.inactive-highlight {
    background: red !important;
    color: white;
  }

  /* POPUP MODAL STYLES */
  #popupModal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  .modal-card {
    background: #111;
    border: 2px solid #00adb5;
    border-radius: 12px;
    padding: 25px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0, 173, 181, 0.4);
  }

  .modal-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 15px;
  }

  .modal-card input {
    width: 100%;
    padding: 10px;
    background: #222;
    border: 1px solid #444;
    color: white;
    border-radius: 4px;
    font-size: 14px;
    margin-bottom: 20px;
    box-sizing: border-box;
    text-align: center;
  }

  .submit-btn {
    background: green;
    color: white;
    border: none;
    width: 100%;
    padding: 12px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    text-transform: uppercase;
  }
  .submit-btn:hover {
    background: #006400;
  }
</style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">Slide Winners Management</div>
    <div class="plus-btn" title="Upload Winner Image" onclick="triggerFileInput()">+</div>
  </div>

  <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelected(event)">

  <!-- 4 COLUMNS GRID CONTAINER -->
  <div class="winners-grid" id="winnersContainer">
    <div style="grid-column: span 4; text-align:center; color:#777;">Loading winners...</div>
  </div>

  <!-- POPUP MODAL FOR UPLOAD DETAILS -->
  <div id="popupModal">
    <div class="modal-card">
      <h3 style="margin-top:0; color:#00adb5;">New Winner Details</h3>
      <img id="previewImg" src="" alt="Preview">
      <div style="font-size: 12px; text-align: left; color: #aaa; margin-bottom: 5px;">Date & Time (dd,mm,yyyy; hh:mm):</div>
      <input type="text" id="dateTimeInput" placeholder="25,10,2026; 18:30">
      <button class="submit-btn" onclick="uploadWinnerData()">Submit</button>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const fileInput = document.getElementById("fileInput");
const popupModal = document.getElementById("popupModal");
const previewImg = document.getElementById("previewImg");
const dateTimeInput = document.getElementById("dateTimeInput");
const winnersContainer = document.getElementById("winnersContainer");

let selectedBase64Image = null;

window.triggerFileInput = function() {
  fileInput.click();
};

window.handleFileSelected = function(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    selectedBase64Image = e.target.result;
    previewImg.src = selectedBase64Image;
    dateTimeInput.value = "";
    popupModal.style.display = "flex";
  };
  reader.readAsDataURL(file);
};

window.uploadWinnerData = async function() {
  const dateTimeVal = dateTimeInput.value.trim();
  if (!dateTimeVal) {
    alert("Please enter the date and time format (dd,mm,yyyy; hh:mm).");
    return;
  }
  if (!selectedBase64Image) {
    alert("No image selected.");
    return;
  }

  try {
    const winnersRef = ref(db, "slideWinners");
    const newWinnerRef = push(winnersRef);
    await set(newWinnerRef, {
      imageUrl: selectedBase64Image,
      dateTime: dateTimeVal,
      active: false, // Default closed eye
      createdAt: Date.now()
    });

    popupModal.style.display = "none";
    fileInput.value = "";
    alert("Winner uploaded successfully!");
  } catch (error) {
    console.error(error);
    alert("Upload failed.");
  }
};

// Render Winners list from Firebase
onValue(ref(db, "slideWinners"), (snapshot) => {
  winnersContainer.innerHTML = "";
  if (!snapshot.exists()) {
    winnersContainer.innerHTML = "<div style='grid-column: span 4; text-align:center; color:#777;'>No winner images uploaded yet.</div>";
    return;
  }

  const items = [];
  snapshot.forEach((childSnapshot) => {
    items.push({
      id: childSnapshot.key,
      ...childSnapshot.val()
    });
  });

  items.forEach((item) => {
    const card = document.createElement("div");
    card.className = "winner-card";

    const isOpenActive = item.active === true;
    const openEyeHighlight = isOpenActive ? "active-highlight" : "";
    const closedEyeHighlight = !isOpenActive ? "inactive-highlight" : "";

    card.innerHTML = `
      <img src="${item.imageUrl}" alt="Winner">
      <div class="card-date">${item.dateTime}</div>
      <div class="card-actions">
        <button class="action-icon" title="Delete" onclick="deleteWinner('${item.id}')">🗑️</button>
        <button class="action-icon eye-open ${openEyeHighlight}" title="Show on Player Side" onclick="setActiveWinner('${item.id}', true)">👁️</button>
        <button class="action-icon eye-closed ${closedEyeHighlight}" title="Hide from Player Side" onclick="setActiveWinner('${item.id}', false)">🔒</button>
      </div>
    `;
    winnersContainer.appendChild(card);
  });
});

window.deleteWinner = async function(id) {
  if (confirm("Are you sure you want to delete this winner image?")) {
    try {
      await remove(ref(db, `slideWinners/${id}`));
    } catch (err) {
      console.error(err);
      alert("Delete failed.");
    }
  }
};

window.setActiveWinner = async function(targetId, makeActive) {
  try {
    const dbRef = ref(db, "slideWinners");
    if (makeActive) {
      // Only one file can have an open eye, so set all to active: false first, then target to true
      const snapshot = await getSnapshot(dbRef); // custom helper or fetch
      // Alternatively, update all items in database to active: false, then set target to true
    }
    
    // Simpler multi-update implementation:
    const snapshot = await new Promise((resolve) => {
      onValue(ref(db, "slideWinners"), resolve, { onlyOnce: true });
    });

    const updates = {};
    if (snapshot.exists()) {
      snapshot.forEach((child) => {
        const id = child.key;
        updates[id + "/active"] = (id === targetId) ? makeActive : false;
      });
      await update(ref(db, "slideWinners"), updates);
    }
  } catch (err) {
    console.error(err);
  }
};

// Helper to retrieve once for Firebase v9 inside the async closure
import { get, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
async function getSnapshot(dbRef) {
  return await get(dbRef);
}
</script>

</body>
</html>
