<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Players Directory & Purchased Lives</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

/* HEADER BAR */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 20px auto;
  border-bottom: 2px solid #003366;
  padding-bottom: 10px;
}

.header-title {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}

.search-toggle-btn {
  font-size: 16px;
  background: #003366;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  user-select: none;
  transition: background 0.2s;
}

.search-toggle-btn:hover {
  background: #004080;
}

/* SEARCH FIELD WRAPPER */
#searchWrapper {
  max-width: 1200px;
  margin: 0 auto 20px auto;
  display: none;
}

#searchInput {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 2px solid #003366;
  background: #111;
  color: white;
  box-sizing: border-box;
}

#searchInput:focus {
  outline: none;
  border-color: #3b82f6;
}

/* DIRECTORY MATRIX (3 Columns Grid layout) */
.players-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  max-width: 1200px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .players-grid {
    grid-template-columns: 1fr;
  }
}

/* INDIVIDUAL DATA PLAYER TILES */
.player-tile {
  background: #001f3f;
  border: 1px solid #003366;
  border-radius: 8px;
  padding: 15px;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, background 0.2s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player-tile:hover {
  transform: translateY(-3px);
  border-color: #3b82f6;
  background: #002a54;
}

.tile-row {
  font-size: 15px;
  word-break: break-all;
}

.label {
  font-size: 11px;
  text-transform: uppercase;
  color: #3b82f6;
  display: block;
  margin-bottom: 2px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.name-value {
  font-size: 18px;
  font-weight: bold;
}

/* CENTRALIZED FULL VIEW MODAL */
#modalOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.88);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  overflow-y: auto;
  padding: 20px;
  box-sizing: border-box;
}

.modal-card {
  background: #111;
  border: 2px solid #3b82f6;
  border-radius: 12px;
  padding: 25px;
  width: 100%;
  max-width: 800px;
  box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
  position: relative;
  box-sizing: border-box;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-close-btn {
  position: absolute;
  top: 15px;
  right: 20px;
  background: #ff4136;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  font-weight: bold;
  cursor: pointer;
}

.modal-card h3 {
  margin-top: 0;
  border-bottom: 1px solid #333;
  padding-bottom: 10px;
  color: #3b82f6;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* 2-COLUMN GRID FOR PURCHASED LIVES DATE TABS */
.date-tabs-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 20px;
}

@media (max-width: 600px) {
  .date-tabs-grid {
    grid-template-columns: 1fr;
  }
}

.date-tab-card {
  background: #001a33;
  border: 1px solid #004080;
  border-radius: 8px;
  padding: 15px;
}

.date-tab-header {
  font-size: 14px;
  color: #00f0ff;
  font-weight: bold;
  border-bottom: 1px solid #003366;
  padding-bottom: 8px;
  margin-bottom: 10px;
  text-align: center;
}

.hearts-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 12px;
}

.heart-icon {
  font-size: 24px;
  cursor: pointer;
  transition: transform 0.2s;
}

.heart-icon:hover {
  transform: scale(1.2);
}

.date-tab-total {
  text-align: center;
  font-size: 13px;
  color: #ccc;
  border-top: 1px solid #003366;
  padding-top: 8px;
}

.date-tab-total span {
  color: #ff668e;
  font-weight: bold;
}

/* CENTER POPUP FOR INDIVIDUAL HEART TIMESTAMP */
#heartPopupOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.75);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.heart-popup-card {
  background: #222;
  border: 2px solid #ff668e;
  padding: 20px 30px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 20px rgba(255, 102, 142, 0.4);
}

.heart-popup-card .popup-title {
  font-size: 12px;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.heart-popup-card .popup-time {
  font-size: 18px;
  color: #ff668e;
  font-weight: bold;
  margin-bottom: 4px;
}

.heart-popup-card .popup-date {
  font-size: 15px;
  color: #fff;
}

.heart-popup-close {
  margin-top: 15px;
  background: #ff668e;
  color: white;
  border: none;
  padding: 6px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">REGISTERED PLAYERS</div>
    <div class="search-toggle-btn" onclick="toggleSearchField()">SEARCH</div>
  </div>

  <div id="searchWrapper">
    <input type="text" id="searchInput" placeholder="Type letters to filter profiles dynamically...">
  </div>

  <div class="players-grid" id="playersContainer"></div>

  <!-- FULL VIEW MODAL FOR PLAYER DETAILS & LIVES -->
  <div id="modalOverlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">X</button>
      <h3>Player Details & Purchased Lives</h3>
      
      <div class="tile-row" style="margin-top:10px;"><span class="label">Full Name</span><span id="popName" style="font-size:18px; font-weight:bold;"></span></div>
      <div class="tile-row" style="margin-top:8px;"><span class="label">ID Number</span><span id="popIdNumber"></span></div>
      <div class="tile-row" style="margin-top:8px;"><span class="label">Email Address</span><span id="popEmail"></span></div>
      <div class="tile-row" style="margin-top:8px;"><span class="label">Cell Number</span><span id="popCell"></span></div>

      <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
        <div class="label" style="font-size: 13px; margin-bottom: 10px;">Purchased Lives History (Grouped by Date)</div>
        <div id="dateTabsContainer" class="date-tabs-grid">
          <div style="grid-column: span 2; text-align:center; color:#777;">Loading purchased lives history...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- HEART TIMESTAMP POPUP MODAL -->
  <div id="heartPopupOverlay" onclick="closeHeartPopup()">
    <div class="heart-popup-card" onclick="event.stopPropagation()">
      <div class="popup-title">Life Purchase Timestamp</div>
      <div class="popup-time" id="popupTimeText"></div>
      <div class="popup-date" id="popupDateText"></div>
      <button class="heart-popup-close" onclick="closeHeartPopup()">OK</button>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allPlayersMemoryBank = [];

const container = document.getElementById("playersContainer");
const searchWrapper = document.getElementById("searchWrapper");
const searchInput = document.getElementById("searchInput");
const modal = document.getElementById("modalOverlay");
const dateTabsContainer = document.getElementById("dateTabsContainer");
const heartPopupOverlay = document.getElementById("heartPopupOverlay");
const popupTimeText = document.getElementById("popupTimeText");
const popupDateText = document.getElementById("popupDateText");

window.toggleSearchField = function() {
  if (searchWrapper.style.display === "block") {
    searchWrapper.style.display = "none";
    searchInput.value = "";
    renderEngine(allPlayersMemoryBank);
  } else {
    searchWrapper.style.display = "block";
    searchInput.focus();
  }
};

async function pullSystemData() {
  container.innerHTML = "<div style='grid-column: span 3; text-align:center;'>Synchronizing database array...</div>";
  try {
    const snapshot = await get(ref(db, "users"));
    if (snapshot.exists()) {
      const collection = [];
      snapshot.forEach((childSnapshot) => {
        collection.push(childSnapshot.val());
      });

      // SORT IN ASCENDING ORDER BY NAME (alphabetically)
      collection.sort((a, b) => {
        const nameA = `${a.name || ''} ${a.surname || ''}`.toLowerCase();
        const nameB = `${b.name || ''} ${b.surname || ''}`.toLowerCase();
        return nameA.localeCompare(nameB);
      });

      allPlayersMemoryBank = collection;
      renderEngine(allPlayersMemoryBank);
    } else {
      container.innerHTML = "<div style='grid-column: span 3; text-align:center;'>No player accounts exist inside directory node.</div>";
    }
  } catch (error) {
    console.error(error);
    container.innerHTML = "<div style='grid-column: span 3; text-align:center; color:red;'>Data Sync Failed.</div>";
  }
}

function renderEngine(dataset) {
  container.innerHTML = "";
  if (dataset.length === 0) {
    container.innerHTML = "<div style='grid-column: span 3; text-align:center; color:orange;'>No matches located.</div>";
    return;
  }

  dataset.forEach((player) => {
    const tileCard = document.createElement("div");
    tileCard.className = "player-tile";
    
    tileCard.innerHTML = `
      <div class="tile-row"><span class="label">Name & Surname</span><span class="name-value">${player.name || ''} ${player.surname || ''}</span></div>
      <div class="tile-row"><span class="label">ID Number</span>${player.idNumber || 'N/A'}</div>
    `;

    tileCard.onclick = () => launchProfileModal(player);
    container.appendChild(tileCard);
  });
}

searchInput.addEventListener("input", (event) => {
  const matchingQuery = event.target.value.toLowerCase().trim();
  const filteredOutput = allPlayersMemoryBank.filter((profile) => {
    const termName = (profile.name || "").toLowerCase();
    const termSurname = (profile.surname || "").toLowerCase();
    const combinedWhole = `${termName} ${termSurname}`;
    const termId = (profile.idNumber || "").toLowerCase();
    const termEmail = (profile.email || "").toLowerCase();

    return termName.includes(matchingQuery) || 
           termSurname.includes(matchingQuery) || 
           combinedWhole.includes(matchingQuery) ||
           termId.includes(matchingQuery) ||
           termEmail.includes(matchingQuery);
  });

  renderEngine(filteredOutput);
});

async function launchProfileModal(playerObj) {
  document.getElementById("popName").innerText = `${playerObj.name || ''} ${playerObj.surname || ''}`;
  document.getElementById("popIdNumber").innerText = playerObj.idNumber || 'N/A';
  document.getElementById("popEmail").innerText = playerObj.email || 'N/A';
  document.getElementById("popCell").innerText = playerObj.cellNumber || 'N/A';

  dateTabsContainer.innerHTML = "<div style='grid-column: span 2; text-align:center; color:#777;'>Loading purchased lives...</div>";
  modal.style.display = "flex";

  try {
    const purchasesSnapshot = await get(ref(db, `lives_purchases/${playerObj.uid}`));
    if (!purchasesSnapshot.exists()) {
      dateTabsContainer.innerHTML = "<div style='grid-column: span 2; text-align:center; color:orange;'>No life purchases recorded for this player.</div>";
      return;
    }

    // Group purchases by date string (e.g., "27 Oct 2026")
    const groupedByDate = {};
    purchasesSnapshot.forEach((childSnap) => {
      const p = childSnap.val();
      const dateObj = new Date(p.time);
      const dateKey = dateObj.toLocaleDateString("en-GB", { day: 'numeric', month: 'short', year: 'numeric' });
      
      if (!groupedByDate[dateKey]) {
        groupedByDate[dateKey] = [];
      }
      
      const count = Number(p.count) || 1;
      for (let i = 0; i < count; i++) {
        groupedByDate[dateKey].push({
          timeStr: dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          dateStr: dateKey
        });
      }
    });

    dateTabsContainer.innerHTML = "";
    const dates = Object.keys(groupedByDate);

    if (dates.length === 0) {
      dateTabsContainer.innerHTML = "<div style='grid-column: span 2; text-align:center; color:orange;'>No life purchases recorded for this player.</div>";
      return;
    }

    dates.forEach((dateKey) => {
      const livesList = groupedByDate[dateKey];
      const card = document.createElement("div");
      card.className = "date-tab-card";

      let heartsHtml = "";
      livesList.forEach((life) => {
        heartsHtml += `<span class="heart-icon" onclick="showHeartPopup('${life.timeStr}', '${life.dateStr}')" title="Click for timestamp">❤️</span>`;
      });

      card.innerHTML = `
        <div class="date-tab-header">${dateKey}</div>
        <div class="hearts-container">${heartsHtml}</div>
        <div class="date-tab-total">Total: <span>${livesList.length}</span> Life${livesList.length > 1 ? 's' : ''}</div>
      `;

      dateTabsContainer.appendChild(card);
    });

  } catch (err) {
    console.error(err);
    dateTabsContainer.innerHTML = "<div style='grid-column: span 2; text-align:center; color:red;'>Failed to load lives history.</div>";
  }
}

window.showHeartPopup = function(timeStr, dateStr) {
  popupTimeText.innerText = timeStr;
  popupDateText.innerText = dateStr;
  heartPopupOverlay.style.display = "flex";
};

window.closeHeartPopup = function() {
  heartPopupOverlay.style.display = "none";
};

window.closeModal = function() {
  modal.style.display = "none";
};

pullSystemData();
</script>

</body>
</html>
