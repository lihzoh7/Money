<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial, sans-serif;
  color: white;
}

/* LOGIN POPUP */
#loginBox {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #111;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  z-index: 100;
}

#loginBox input {
  display: block;
  width: 200px;
  margin: 10px auto;
  padding: 10px;
  border: none;
  border-radius: 5px;
  background: #222;
  color: white;
}

#loginBox button {
  padding: 10px 20px;
  background: #003366;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

#status {
  margin-top: 10px;
  font-size: 14px;
  color: orange;
}

/* MAIN INTERFACE CONTAINER (Hidden until authenticated) */
#mainWrapper {
  display: none;
  width: 90%;
  max-width: 1000px;
  margin: 5vh auto;
}

/* HEADER NAVIGATION BAR */
.panel-header {
  text-align: center;
  padding: 15px;
  background: #00152b;
  border-radius: 8px;
  margin-bottom: 15px;
  border: 1px solid #002b5c;
}

.panel-title {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 15px;
  color: #60a5fa;
}

/* TOP NAVIGATION TABS ROW */
.nav-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.nav-tab-btn {
  padding: 10px 20px;
  background: #002244;
  color: white;
  border: 1px solid #3b82f6;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15sxx;
  transition: background 0.2s, transform 0.1s;
}

.nav-tab-btn:hover {
  background: #004080;
  transform: translateY(-2px);
}

.nav-tab-btn.active {
  background: #3b82f6;
}

/* PANELS (3-Column Grid view configurations) */
.view-panel {
  display: none;
  background: #001f3f;
  padding: 15px;
  border-radius: 8px;
  box-sizing: border-box;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.view-panel.active {
  display: grid;
}

/* STRETCHING TILES */
.tile {
  background: #003366;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: background 0.2s, border-color 0.2s, transform 0.1s;
  width: 100%;
  text-align: center;
  padding: 0 5px;
  box-sizing: border-box;
}

.tile:hover {
  background: #004080;
  border-color: #3b82f6;
  transform: translateY(-2px);
}

.tile:active {
  transform: translateY(0);
}
</style>
</head>

<body>

<div id="loginBox">
  <h3>Admin Login</h3>
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button id="loginBtn">LOGIN</button>
  <div id="status"></div>
</div>

<div id="mainWrapper">

  <div class="panel-header">
    <div class="panel-title">ADMIN</div>
    <div class="nav-tabs">
      <button class="nav-tab-btn active" onclick="switchPanel('panelAdmin', this)">SLIDE</button>
      <button class="nav-tab-btn" onclick="switchPanel('panelQuizer', this)">QUIZER</button>
      <button class="nav-tab-btn" onclick="switchPanel('panelWordz', this)">WORDZ</button>
      <button class="nav-tab-btn" onclick="switchPanel('panelGeneral', this)">GENERAL</button>
    </div>
  </div>

  <!-- PANEL 1: SLIDE (Admin Panel) -->
  <div id="panelAdmin" class="view-panel active">
    <div class="tile" onclick="go('admin-prizes.html')">PRIZES</div>
    <div class="tile" onclick="go('pop-up-admin.html')">POP UP</div>
    <div class="tile" onclick="go('queries.html')">QUERIES</div>
    <div class="tile" onclick="go('wallet-admin.html')">WALLET</div>
    <div class="tile" onclick="go('transactions.html')">TRANSACTIONS</div>
    <div class="tile" onclick="go('leaderboard-admin.html')">LEADERBOARD</div>
    <div class="tile" onclick="go('players-admin.html')">PLAYERS</div>
    <div class="tile" onclick="go('envelope-admin.html')">✉ ENVELOPE</div>
  </div>

  <!-- PANEL 2: QUIZER -->
  <div id="panelQuizer" class="view-panel">
    <div class="tile" onclick="go('quizmaker.html')">QUIZER</div>
    <div class="tile" onclick="go('audio.html')">AUDIO</div>
    <div class="tile" onclick="go('video.html')">VIDEO</div>
    <div class="tile" onclick="go('images.html')">IMAGES</div>
    <div class="tile" onclick="go('adminquizerleaderboard.html')">LEADERBOARD</div>
    <div class="tile" onclick="go('prizequizer.html')">PRIZE</div>
    <div class="tile" onclick="go('search.html')">SEARCH</div>
  </div>

  <!-- PANEL 3: WORDZ -->
  <div id="panelWordz" class="view-panel">
    <div class="tile" onclick="go('wordsadmin.html')">ADMIN</div>
    <div class="tile" onclick="go('wordsuploaded.html')">CAHER</div>
    <div class="tile" onclick="go('tri.html')">SAVER</div>
    <div class="tile" onclick="go('test1.html')">Test1</div>
    <div class="tile" onclick="go('test2.html')">Test2</div>
    <div class="tile" onclick="go('test3.html')">Test3</div>
  </div>

  <!-- PANEL 4: GENERAL -->
  <div id="panelGeneral" class="view-panel">
    <div class="tile" onclick="go('playerswallets.html')">PLAYER WALLETS</div>
    <div class="tile" onclick="go('general-b.html')">B</div>
    <div class="tile" onclick="go('general-c.html')">C</div>
    <div class="tile" onclick="go('general-d.html')">D</div>
    <div class="tile" onclick="go('general-e.html')">E</div>
    <div class="tile" onclick="go('general-f.html')">F</div>
    <div class="tile" onclick="go('general-g.html')">G</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {  
  getAuth,  
  signInWithEmailAndPassword,  
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

import {  
  getDatabase,  
  ref,  
  get  
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

/* INIT */
const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* ELEMENTS */
const emailEl = document.getElementById("email");
const passEl = document.getElementById("pass");
const statusEl = document.getElementById("status");
const loginBtn = document.getElementById("loginBtn");

/* LOGIN BUTTON */
loginBtn.addEventListener("click", login);

async function login(){
  const email = emailEl.value.trim();
  const pass = passEl.value;

  if(!email || !pass){
    statusEl.innerText = "Enter email & password";
    return;
  }

  statusEl.innerText = "Logging in...";

  try{
    const userCred = await signInWithEmailAndPassword(auth, email, pass);
    const uid = userCred.user.uid;

    const snap = await get(ref(db, "admins/" + uid));

    if(snap.exists()){
      statusEl.innerText = "Success ✅";
      showPanel();
    } else {
      statusEl.innerText = "Not admin ❌";
      await signOut(auth);
    }
  }catch(e){
    console.error(e);
    statusEl.innerText = "Login failed ❌";
  }
}

/* AUTO LOGIN CHECK */
onAuthStateChanged(auth, async (user)=>{
  if(!user) return;

  const snap = await get(ref(db, "admins/" + user.uid));
  if(snap.exists()){
    showPanel();
  }
});

/* SHOW MAIN INTERFACE */
function showPanel(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("mainWrapper").style.display = "block";
}

/* TAB SWITCHER LOGIC */
window.switchPanel = function(panelId, btnElement) {
  // Hide all panels
  const panels = document.querySelectorAll(".view-panel");
  panels.forEach(panel => panel.classList.remove("active"));

  // Remove active class from all navigation buttons
  const buttons = document.querySelectorAll(".nav-tab-btn");
  buttons.forEach(btn => btn.classList.remove("active"));

  // Show target panel and highlight clicked button
  document.getElementById(panelId).classList.add("active");
  btnElement.classList.add("active");
}

/* NAVIGATION */
window.go = (p) => location.href = p;

</script>

</body>
</html>
