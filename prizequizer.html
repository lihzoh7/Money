<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizer Prize Admin</title>

<style>
body {
  background: #001f3f;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
  margin: 0;
}

.header-bar {
  border-bottom: 2px solid #3b82f6;
  padding-bottom: 10px;
  margin-bottom: 20px;
}

h2 {
  margin: 0 0 10px 0;
  letter-spacing: 1px;
}

#week {
  color: #60a5fa;
  font-size: 16px;
  font-weight: bold;
}

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 15px;
  max-width: 1200px;
}

.cell {
  background: #003366;
  border: 1px solid #3b82f6;
  border-radius: 6px;
  padding: 15px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.cell:hover {
  background: #004080;
  transform: translateY(-2px);
}

.cell-title {
  font-size: 12px;
  color: #60a5fa;
  text-transform: uppercase;
  margin-bottom: 5px;
  font-weight: bold;
}

.cell-value {
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header-bar">
  <h2>QUIZER PRIZE MATRIX (ADMIN)</h2>
  <div id="week">Synchronizing calendar...</div>
</div>

<div id="grid"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  
const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

/* ADMIN AUTHENTICATION GUARD */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "admin.html";
    return;
  }

  const snap = await get(ref(db, "admins/" + user.uid));
  if (!snap.exists()) {
    alert("Not admin ❌");
    location.href = "admin.html";
  }
});

const days = 7;
const rows = 2;

function getWeek() {
  let now = new Date();
  let start = new Date(now.setDate(now.getDate() - ((now.getDay() + 6) % 7)));
  let end = new Date(start);
  end.setDate(start.getDate() + 6);

  return {
    from: start.toDateString(),
    to: end.toDateString()
  };
}

function render(data) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (let d = 0; d < days; d++) {
    for (let r = 0; r < rows; r++) {
      let val = data?.schedule?.[d]?.[r]?.value || 0;

      let div = document.createElement("div");
      div.className = "cell";
      
      div.innerHTML = `
        <div class="cell-title">Day ${d} — Slot ${r}</div>
        <div class="cell-value">R ${val}</div>
      `;

      div.onclick = () => {
        let v = prompt(`Enter new cash pool amount for Day ${d}, Slot ${r}:`, val);
        if (v !== null && v.trim() !== "") {
          // Saving to quizer specific branch to avoid conflict
          update(ref(db, `quizer/prizes/schedule/${d}/${r}`), {
            value: parseInt(v)
          });
        }
      };

      grid.appendChild(div);
    }
  }
}

// Subscribing to separate Quizer node array
onValue(ref(db, "quizer/prizes"), snap => {
  let data = snap.val() || {};
  const week = getWeek();
  
  set(ref(db, "quizer/prizes/fromDate"), week.from);
  set(ref(db, "quizer/prizes/toDate"), week.to);
  
  document.getElementById("week").innerText = "Active Week Pool: " + week.from + " - " + week.to;

  render(data);
});
</script>

</body>
</html>
