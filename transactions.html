<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Transactions</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:15px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.dayTab{

  background:#4da6ff;

  color:white;

  padding:15px;

  border-radius:10px;

  margin-top:20px;

  cursor:pointer;

  font-size:20px;

  font-weight:bold;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.dayContent{

  display:none;

  margin-top:10px;
}

.transactionsGrid{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(300px,1fr));

  gap:15px;
}

.card{

  background:#1e293b;

  padding:15px;

  border-radius:10px;

  line-height:1.7;

  word-break:break-word;
}

.totalBar{

  margin-top:15px;

  background:#38bdf8;

  color:white;

  padding:15px;

  border-radius:10px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  font-size:20px;

  font-weight:bold;
}

.empty{

  text-align:center;

  margin-top:50px;

  color:#aaa;

  font-size:20px;
}

.small{

  color:#aaa;

  font-size:14px;
}

</style>
</head>

<body>

<h1>💳 Transactions</h1>

<div id="container"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",

  authDomain: "tose-ccf8f.firebaseapp.com",

  databaseURL:
  "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "tose-ccf8f",

  storageBucket:
  "tose-ccf8f.appspot.com",

  messagingSenderId:
  "475447495901",

  appId:
  "1:475447495901:web:9189276a162a3680afdf34"
};

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const container =
  document.getElementById("container");

/* LOAD TRANSACTIONS */

onValue(ref(db,"transactions"), snap=>{

  const data = snap.val() || {};

  container.innerHTML = "";

  /* NO DATA */

  if(Object.keys(data).length === 0){

    container.innerHTML = `

      <div class="empty">
        No transactions yet
      </div>

    `;

    return;
  }

  /* GROUPED BY DAY */

  const grouped = {};

  Object.values(data).forEach(t=>{

    /* SKIP BAD DATA */

    if(!t) return;

    if(!t.approvedAt) return;

    const date =
      new Date(Number(t.approvedAt));

    if(isNaN(date.getTime())) return;

    const dayKey =
      date.toLocaleDateString(
        "en-GB",
        {
          weekday:"long",
          day:"2-digit",
          month:"short",
          year:"numeric"
        }
      );

    if(!grouped[dayKey]){

      grouped[dayKey] = [];
    }

    grouped[dayKey].push(t);
  });

  const dates =
    Object.keys(grouped).reverse();

  /* STILL EMPTY */

  if(dates.length === 0){

    container.innerHTML = `

      <div class="empty">
        No valid transactions
      </div>

    `;

    return;
  }

  /* CREATE DAY SECTIONS */

  dates.forEach((date,index)=>{

    const transactions =
      grouped[date];

    let total = 0;

    /* CALCULATE TOTAL */

    transactions.forEach(t=>{

      const amount =

        Number(

          String(t.price || 0)
          .replace("R","")

        ) || 0;

      total += amount;
    });

    /* TAB */

    const tab =
      document.createElement("div");

    tab.className = "dayTab";

    tab.innerHTML = `

      <span>${date}</span>

      <span>▼</span>

    `;

    /* CONTENT */

    const content =
      document.createElement("div");

    content.className =
      "dayContent";

    content.style.display =
      index === 0
      ? "block"
      : "none";

    /* CARDS */

    let html = `

      <div class="transactionsGrid">

    `;

    transactions.forEach(t=>{

      html += `

        <div class="card">

          <b>
            ${t.name || ""}
            ${t.surname || ""}
          </b>

          <br>

          ${t.email || "No email"}

          <br><br>

          🧾
          ${t.item || "No item"}

          <br>

          💎 Gems:
          ${t.gems || 0}

          <br>

          ❤️ Lives:
          ${t.lives || 0}

          <br>

          👥 Referral:
          ${t.referral || "none"}

          <br><br>

          <div class="small">

            ${new Date(
              Number(t.approvedAt)
            ).toLocaleString()}

          </div>

        </div>

      `;
    });

    html += `

      </div>

      <div class="totalBar">

        <span>Total</span>

        <span>
          R ${total.toFixed(2)}
        </span>

      </div>

    `;

    content.innerHTML = html;

    /* TOGGLE */

    tab.onclick = ()=>{

      content.style.display =

        content.style.display === "none"

        ? "block"

        : "none";
    };

    /* APPEND */

    container.appendChild(tab);

    container.appendChild(content);

  });

});

</script>

</body>
  </html>
