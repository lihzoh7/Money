<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Transactions</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  padding:20px;
}

h2{
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#1e1e1e;
  border-radius:10px;
  overflow:hidden;
}

th, td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid #333;
}

th{
  background:#222;
  color:#00ff99;
}

tr:hover{
  background:#2a2a2a;
}

.empty{
  text-align:center;
  margin-top:50px;
  color:#777;
}
</style>
</head>

<body>

<h2>📊 TRANSACTIONS</h2>

<div id="wrap"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const wrap = document.getElementById("wrap");

/* LOAD TRANSACTIONS */
onValue(ref(db,"transactions"), snap => {

  const data = snap.val() || {};
  const keys = Object.keys(data).reverse();

  if(keys.length === 0){
    wrap.innerHTML = `<div class="empty">No transactions yet</div>`;
    return;
  }

  let html = `
    <table>
      <tr>
        <th>Name</th>
        <th>Item</th>
        <th>Price</th>
      </tr>
  `;

  keys.forEach(id => {
    const t = data[id];

    html += `
      <tr>
        <td>${t.name || ""} ${t.surname || ""}</td>
        <td>${t.item || ""}</td>
        <td>${t.price || ""}</td>
      </tr>
    `;
  });

  html += `</table>`;

  wrap.innerHTML = html;

});

</script>

</body>
</html>
