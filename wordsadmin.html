<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Words Admin - Word Upload</title>
<style>
  body {
    margin: 0; background: #1a1a1a; color: white; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 20px;
  }
  #header {
    width: 100%; max-width: 900px; display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 20px;
  }
  #toggleBtn {
    background: #0074D9; color: white; border: none; padding: 12px 30px;
    font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
  }
  #gridContainer {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    width: 100%; max-width: 900px; max-height: 75vh; overflow-y: auto;
    background: #2a2a2a; padding: 15px; border-radius: 10px; box-sizing: border-box;
  }
  input.word-input {
    width: 100%; padding: 6px; box-sizing: border-box; background: #333;
    color: white; border: 1px solid #555; border-radius: 4px; text-transform: uppercase;
  }
  input.word-input:disabled { background: #222; color: #888; border-color: #333; }
</style>
</head>
<body>

<div id="header">
  <h2>WORDS ADMIN PANEL</h2>
  <button id="toggleBtn">EDIT</button>
</div>

<div id="gridContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let isEditing = false;
const gridContainer = document.getElementById("gridContainer");
const toggleBtn = document.getElementById("toggleBtn");

onAuthStateChanged(auth, async (u) => {
  if(!u) { location.href = "index.html"; return; }
  const adminSnap = await get(ref(db, "admins/" + u.uid));
  if(!adminSnap.exists()){
    alert("Admin privileges required.");
    location.href = "main-menu.html";
    return;
  }
  buildInputGrid();
  loadWords();
});

function buildInputGrid() {
  gridContainer.innerHTML = "";
  for (let i = 0; i < 350; i++) { // 5x70 = 350 fields
    let input = document.createElement("input");
    input.type = "text";
    input.className = "word-input";
    input.id = "field-" + i;
    input.disabled = true;
    gridContainer.appendChild(input);
  }
}

async function loadWords() {
  const snap = await get(ref(db, "words/wordsList"));
  if (snap.exists()) {
    let data = snap.val();
    let wordArr = Object.values(data).map(item => typeof item === "string" ? item : item.word);
    wordArr.forEach((w, idx) => {
      let input = document.getElementById("field-" + idx);
      if (input) input.value = w;
    });
  }
}

toggleBtn.onclick = async () => {
  if (!isEditing) {
    // Switch to EDIT mode
    isEditing = true;
    toggleBtn.innerText = "SUBMIT";
    toggleBtn.style.background = "#28a745";
    document.querySelectorAll(".word-input").forEach(i => i.disabled = false);
  } else {
    // SUBMIT data
    toggleBtn.innerText = "SAVING...";
    toggleBtn.disabled = true;

    let wordMap = {};
    let inputs = document.querySelectorAll(".word-input");
    let count = 0;

    inputs.forEach((input) => {
      let val = input.value.trim().toUpperCase();
      if (val.length >= 2) {
        let key = "word_" + count;
        wordMap[key] = { word: val };
        count++;
      }
    });

    await set(ref(db, "words/wordsList"), wordMap);
    alert(`Successfully saved ${count} words!`);

    isEditing = false;
    toggleBtn.innerText = "EDIT";
    toggleBtn.style.background = "#0074D9";
    toggleBtn.disabled = false;
    document.querySelectorAll(".word-input").forEach(i => i.disabled = true);
  }
};
</script>
</body>
</html>
