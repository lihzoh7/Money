<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  padding:20px;
}

h2{
  margin-top:30px;
}

.card{
  background:#1e1e1e;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}

.btn{
  margin-top:10px;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
  text-align:center;
}

.approve{ background:green; }
.reject{ background:red; }

small{ color:#aaa; }
</style>
</head>

<body>

<h1>⚙️ ADMIN PANEL</h1>

<h2>👥 Users</h2>
<div id="usersList"></div>

<h2>📋 Applications</h2>
<div id="appsList"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { 
  getDatabase, ref, onValue, get, set, update, remove 
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const usersList = document.getElementById("usersList");
const appsList = document.getElementById("appsList");

let currentUser;

/* =========================
   🔐 AUTH + ADMIN CHECK
========================= */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href = "admin.html";
    return;
  }

  const adminSnap = await get(ref(db, "admins/" + user.uid));

  if(!adminSnap.exists()){
    alert("Not admin ❌");
    location.href = "admin.html";
    return;
  }

  currentUser = user;

  loadUsers();
  loadApplications();
});

/* =========================
   👥 LOAD USERS
========================= */
function loadUsers(){
  onValue(ref(db,"users"), snap=>{
    const data = snap.val() || {};
    usersList.innerHTML = "";

    Object.keys(data).forEach(uid=>{
      const u = data[uid];

      let div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <b>${u.name || ""} ${u.surname || ""}</b><br>
        📧 ${u.email || ""}<br>
        📞 ${u.cellNumber || ""}<br>
        ✅ Approved: ${u.approved ? "YES" : "NO"}
      `;

      usersList.appendChild(div);
    });
  });
}

/* =========================
   📋 LOAD APPLICATIONS
========================= */
function loadApplications(){
  onValue(ref(db,"applications"), snap=>{
    const data = snap.val() || {};
    appsList.innerHTML = "";

    Object.keys(data).forEach(uid=>{
      const a = data[uid];

      let div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <b>${a.name} ${a.surname}</b><br>
        📞 ${a.number}<br>
        🎂 ${a.age}<br>
        🔗 ${a.referral || "None"}<br>
        <small>${new Date(a.timestamp).toLocaleString()}</small>

        <div class="btn approve" onclick="approve('${uid}')">
          APPROVE ✅
        </div>
      `;

      appsList.appendChild(div);
    });
  });
}

/* =========================
   ✅ APPROVE USER
========================= */
window.approve = async function(uid){

  const snap = await get(ref(db,"applications/"+uid));
  const data = snap.val();

  if(!data) return;

  const now = Date.now();

  // Move to history
  await set(ref(db,"applicationsHistory/"+uid),{
    ...data,
    approvedAt: now
  });

  // Approve user
  await update(ref(db,"users/"+uid),{
    approved:true
  });

  // Remove application
  await remove(ref(db,"applications/"+uid));

  alert("User approved ✅");
};

</script>

</body>
</html>
