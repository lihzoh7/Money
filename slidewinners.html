<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Slide Winners Management</title>

<style>
body {
  margin: 0;
  background: #0f172a;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 30px auto;
  border-bottom: 2px solid #1e3a8a;
  padding-bottom: 15px;
}

.header-title {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}

/* PLUS SIGN UPLOAD BUTTON */
.plus-btn {
  background: #2563eb;
  color: white;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(37,99,235,0.4);
  transition: transform 0.2s;
  user-select: none;
}
.plus-btn:hover {
  transform: scale(1.08);
  background: #3b82f6;
}

/* 4 COLUMNS GRID CONTAINER */
.winners-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

@media (max-width: 1024px) {
  .winners-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .winners-grid { grid-template-columns: 1fr; }
}

/* WINNER CARD */
.winner-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 12px;
  box-sizing: border-box;
}

.card-datetime {
  font-size: 13px;
  color: #38bdf8;
  font-weight: bold;
  margin-bottom: 8px;
  text-align: center;
}

.card-img-wrap {
  width: 100%;
  height: 160px;
  background: #000;
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.action-icon {
  background: #334155;
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
}

.action-icon:hover {
  background: #475569;
}

/* Active eye highlight states */
.action-icon.open-active {
  background: #22c55e !important; /* Green highlight */
  color: black;
  font-weight: bold;
}

.action-icon.closed-active {
  background: #ef4444 !important; /* Red highlight */
  color: white;
  font-weight: bold;
}

/* MODAL POPUP */
#uploadModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-box {
  background: #111;
  border: 2px solid #3b82f6;
  border-radius: 12px;
  padding: 25px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-sizing: border-box;
}

.modal-box h3 {
  margin-top: 0;
  color: #3b82f6;
  text-transform: uppercase;
}

.modal-box img {
  max-width: 100%;
  max-height: 180px;
  border-radius: 6px;
  margin-bottom: 15px;
}

.modal-input {
  width: 100%;
  padding: 10px;
  background: #222;
  border: 1px solid #444;
  color: white;
  border-radius: 4px;
  box-sizing: border-box;
  margin-bottom: 15px;
  font-size: 15px;
}

.submit-tab-btn {
  width: 100%;
  padding: 12px;
  background: green;
  color: white;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  text-transform: uppercase;
}
.submit-tab-btn:hover {
  background: #006400;
}
</style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">SLIDE WINNERS MANAGEMENT</div>
    <div class="plus-btn" title="Upload Winner Image" onclick="triggerFileSelect()">+</div>
  </div>

  <!-- HIDDEN FILE INPUT -->
  <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelected(event)">

  <!-- 4 COLUMNS GRID -->
  <div class="winners-grid" id="winnersContainer">
    <div style="grid-column: span 4; text-align: center; color: #777;">Loading winners...</div>
  </div>

  <!-- POPUP MODAL FOR METADATA -->
  <div id="uploadModal">
    <div class="modal-box">
      <h3>Configure Winner</h3>
      <img id="previewImg" src="" alt="Preview">
      <input type="text" id="dateTimeInput" class="modal-input" placeholder="dd,mm,yyyy; hh:mm">
      <button class="submit-tab-btn" onclick="uploadWinnerData()">SUBMIT</button>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, set, get, push, remove, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);
const auth = getAuth(app);

let selectedFile = null;
let activeWinnerId = null;

onAuthStateChanged(auth, async (u) => {
  if (!u) {
    location.href = "index.html";
    return;
  }
  const adminSnap = await get(ref(db, "admins/" + u.uid));
  if (!adminSnap.exists()) {
    alert("Access restricted to administrators.");
    location.href = "slide.html";
    return;
  }
  loadWinnersData();
});

window.triggerFileSelect = function() {
  document.getElementById("fileInput").click();
};

window.handleFileSelected = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  selectedFile = file;

  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById("previewImg").src = e.target.result;
    
    // Auto populate current date time format: dd,mm,yyyy; hh:mm
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    document.getElementById("dateTimeInput").value = `${dd},${mm},${yyyy}; ${hh}:${min}`;

    document.getElementById("uploadModal").style.display = "flex";
  };
  reader.readAsDataURL(file);
};

window.uploadWinnerData = async function() {
  const dateTimeVal = document.getElementById("dateTimeInput").value.trim();
  if (!dateTimeVal) {
    alert("Please enter date and time.");
    return;
  }

  try {
    document.querySelector(".submit-tab-btn").innerText = "UPLOADING...";
    
    const storagePath = `slideWinners/${Date.now()}_${selectedFile.name}`;
    const fileRef = sRef(storage, storagePath);
    await uploadBytes(fileRef, selectedFile);
    const downloadUrl = await getDownloadURL(fileRef);

    const newWinnerRef = push(ref(db, "slideWinners"));
    await set(newWinnerRef, {
      id: newWinnerRef.key,
      imageUrl: downloadUrl,
      dateTime: dateTimeVal,
      createdAt: Date.now()
    });

    document.getElementById("uploadModal").style.display = "none";
    document.getElementById("fileInput").value = "";
    document.querySelector(".submit-tab-btn").innerText = "SUBMIT";
  } catch (error) {
    console.error(error);
    alert("Upload failed: " + error.message);
    document.querySelector(".submit-tab-btn").innerText = "SUBMIT";
  }
};

function loadWinnersData() {
  const winnersRef = ref(db, "slideWinners");
  const activeRef = ref(db, "slideWinnersState/activeWinnerId");

  onValue(activeRef, (activeSnap) => {
    activeWinnerId = activeSnap.val() || null;
    
    onValue(winnersRef, (snapshot) => {
      const container = document.getElementById("winnersContainer");
      container.innerHTML = "";

      if (!snapshot.exists()) {
        container.innerHTML = "<div style='grid-column: span 4; text-align: center; color: #777;'>No winner images uploaded yet.</div>";
        return;
      }

      const list = [];
      snapshot.forEach((child) => {
        list.push(child.val());
      });

      // Newest first
      list.sort((a, b) => b.createdAt - a.createdAt);

      list.forEach((item) => {
        const isOpenActive = (item.id === activeWinnerId);
        const isClosedActive = !isOpenActive; // Red when closed/hidden from players

        const card = document.createElement("div");
        card.className = "winner-card";
        card.innerHTML = `
          <div class="card-datetime">${item.dateTime}</div>
          <div class="card-img-wrap">
            <img src="${item.imageUrl}" alt="Winner">
          </div>
          <div class="card-actions">
            <button class="action-icon" title="Delete" onclick="deleteWinner('${item.id}')">🗑️</button>
            <button class="action-icon ${isOpenActive ? 'open-active' : ''}" title="Show to Players (Open Eye)" onclick="setWinnerActive('${item.id}', true)">👁️</button>
            <button class="action-icon ${isClosedActive ? 'closed-active' : ''}" title="Hide from Players (Closed Eye)" onclick="setWinnerActive('${item.id}', false)">🔒</button>
          </div>
        `;
        container.appendChild(card);
      });
    }, { onlyOnce: true });
  });
}

window.setWinnerActive = async function(id, makeVisible) {
  try {
    if (makeVisible) {
      const snap = await get(ref(db, `slideWinners/${id}`));
      if (snap.exists()) {
        const val = snap.val();
        await set(ref(db, "slideWinnersState/activeWinner"), {
          imageUrl: val.imageUrl,
          dateTime: val.dateTime,
          visible: true
        });
        await set(ref(db, "slideWinnersState/activeWinnerId"), id);
      }
    } else {
      // If hiding the currently active one
      if (id === activeWinnerId) {
        await set(ref(db, "slideWinnersState/activeWinner"), { visible: false });
        await set(ref(db, "slideWinnersState/activeWinnerId"), null);
      }
    }
  } catch (err) {
    console.error(err);
    alert("Failed to update status.");
  }
};

window.deleteWinner = async function(id) {
  if (confirm("Are you sure you want to delete this winner record?")) {
    try {
      await remove(ref(db, `slideWinners/${id}`));
      if (id === activeWinnerId) {
        await set(ref(db, "slideWinnersState/activeWinner"), { visible: false });
        await set(ref(db, "slideWinnersState/activeWinnerId"), null);
      }
    } catch (err) {
      console.error(err);
      alert("Failed to delete.");
    }
  }
};
</script>

</body>
</html>
